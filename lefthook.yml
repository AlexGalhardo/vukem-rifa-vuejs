# Git hooks: bun install runs "lefthook install".
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      # Fails listing unformatted files; fix with `golangci-lint fmt`.
      run: 'out=$(gofmt -l {staged_files}); test -z "$out" || { echo "$out"; exit 1; }'
    govet:
      glob: "*.go"
      run: go vet ./...
    biome:
      glob: "*.{js,ts,vue,json,css}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    markdown:
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    go-test:
      run: go test ./...
    typecheck:
      run: bun run typecheck
