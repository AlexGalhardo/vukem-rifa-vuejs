version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 (native compiler) lacks the API vue-tsc needs (PLAN.md D3).
      - dependency-name: typescript
        versions: [">=7.0.0"]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
